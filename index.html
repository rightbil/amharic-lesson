<!DOCTYPE html>
<html lang="am">
<head>

    <title>Amharic Random Word Game</title>

</head>
<body>
    <di class="container">

    <h1>የቃላት ጨዋታ</h1>

<div id="countdown">5</div>

    </div>
    </div>

    <script src="script.js"></script>
